version: "2"

# The strictest lint gate derived from control-point, hardstand, and birdcage.
# Every linter listed below is enabled in at least one of the three repos; where
# settings differ, the stricter value wins. A linter appears once, with every
# setting that any of the three repos applies to it, merged.
#
# What is NOT here, and why — goconf's policy declares only no_clones.
# No BPL budget, layers, or rule table rules exist in this tree;
# nothing here references them because none are declared.

linters:
  default: none
  enable:
    # correctness: a real defect, no taste
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - unparam
    - govet
    - bodyclose
    - noctx
    - containedctx
    - contextcheck
    - nilerr
    - nilnil
    - nilnesserr
    - errorlint
    - errname
    - err113
    - wrapcheck
    - forcetypeassert
    - errchkjson
    - unconvert
    - predeclared
    - copyloopvar
    - wastedassign
    - intrange
    - usestdlibvars
    - durationcheck
    - makezero
    - mirror
    - musttag
    - protogetter
    - canonicalheader
    - bidichk
    - asciicheck
    - dupword
    - rowserrcheck
    - sqlclosecheck
    - unqueryvet
    - nosprintfhostport
    - gosmopolitan
    - gocritic
    - goconst
    - exhaustive
    - gochecksumtype
    - prealloc
    - whitespace
    - goprintffuncname
    - gocheckcompilerdirectives
    - nolintlint
    - nonamedreturns
    - nakedret
    - dogsled
    - iotamixing
    - recvcheck
    - reassign
    - iface
    - inamedparam
    - perfsprint
    - usetesting
    - testableexamples
    - misspell
    - gomoddirectives
    - tagalign
    - modernize
    - godox
    - godot
    - wsl_v5

    # security
    - gosec
    - fatcontext
    - exptostd
    - mnd

    # budget discipline: size and complexity rules. The five budget linters below
    # mirror the thresholds birdcage and hardstand enforce through their lint
    # configs; goconf's policy declares them too (file_budget, function_budget,
    # branching_budget, comment_budget), so each linter below has a single owner.
    # When the BPL budget rules take over these checks, these five are removed
    # in the same commit — never both at once.
    - funlen
    - gocyclo
    - gocognit
    - cyclop
    - maintidx

    # type discipline: exhaustiveness, concreteness, no ambient state
    - exhaustruct_v5
    - ireturn
    - interfacebloat
    - gochecknoglobals
    - gochecknoinits
    - forbidigo

    # test hygiene
    - tparallel
    - thelper

  disable:
    # taste: a house style, not a defect. Each fires on code this repo writes
    # on purpose; a rule that fires on correct code is a rule someone turns off.
    # Each is a global disable because none of these linters apply to any Go
    # code goconf writes, and each names the taste it guards against.
    - lll                # line length: goconf writes long rationale lines on purpose
    - noinlineerr        # guard scoping choice, not a defect
    - nlreturn           # blank line before return: reading choice
    - varnamelen         # short names in short scope are clear
    - tagliatelle        # struct-tag casing: no wire types yet
    - grouper            # import grouping: gofumpt owns layout
    - decorder           # declaration order: reading choice
    - godoclint          # comments are rationales, not API prose
    - funcorder          # exported before unexported: reading choice
    - embeddedstructfieldcheck # embedded-field placement: layout rule
    - paralleltest       # suite is deliberately serial where order matters
    - testpackage        # rule tables must be in-package to exercise unexported matchers
    - promlinter         # no metrics in this repository yet
    - loggercheck        # no logger in this repository yet
    - sloglint           # no slog in this repository yet
    - zerologlint        # no zerolog in this repository yet
    - testifylint        # suite uses the standard library
    - ginkgolinter       # neither ginkgo nor gomega is used
    - dupl               # duplication: policy's no_clones rule owns it
    - depguard           # import restriction: goconf pins no dependency policy
    - gomodguard         # module restriction: goconf pins no modules beyond its own

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    govet:
      enable-all: true
    staticcheck:
      checks:
        - SA
        - S
        - QF
        - '-ST1000'   # package comment form — goconf's house style
        - '-ST1003'   # initialism naming — goconf has chosen names
        - '-ST1020'   # exported comment form — goconf's house style
        - '-ST1021'   # comment on exported type — goconf's house style
        - '-ST1022'   # comment on exported var — goconf's house style
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
    exhaustive:
      default-signifies-exhaustive: false
    mnd:
      ignored-functions:
        - strconv.ParseInt
        - strconv.ParseFloat
        - strconv.ParseUint
        - strconv.Atoi
      ignored-numbers:
        - '0'
        - '1'
        - '-1'
        - '2'
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
    forbidigo:
      forbid:
        - pattern: '^any$'
          analyze-types: true
          msg: "a bare `any` is an untyped value; name the domain kind"
    gosec:
    gocognit:
      min-complexity: 10
    cyclop:
      max-complexity: 10
      package-average: 0.0
    funlen:
      lines: 60
      statements: 40
    gocyclo:
      min-complexity: 10
    maintidx:
      under: 20
    godot:
      scope: declarations
      period: true
    godox:
      keywords: [TODO, FIXME, BUG, XXX]
    ireturn:
      allow:
        - error
        - stdlib.Error
        - ast.Expr
    interfacebloat:
      max: 5
    dogsled:
      max-blank-identifiers: 2
    perfsprint:
      strconcat: true
      sprintf1: true
      err-error: false
    goconst:
      min-len: 3
      min-occurrences: 3
    wsl_v5:
      branch-max-lines: 2
    prealloc:
      simple: true
      range-loops: true
    unparam:
      check-exported: false

  exclusions:
    generated: strict
    # policy/fixtures/* are intentionally rule-violating examples: the BPL
    # budget rules (file_budget, function_budget, branching_budget,
    # comment_budget) are supposed to fire on them. Excluding them from lint
    # keeps the gate clean without weakening it — a fixture that passes lint
    # is a fixture that doesn't test its rule.
    rules:
      - path: policy/fixtures/.*_positive/.*\.go
        linters:
          - forbidigo   # the no_untyped_value positive fixture must spell `any` to prove the rule bites
          - gocognit
          - gocyclo
          - godot
          - ineffassign
          - mnd
          - unused
          - wsl_v5
          - cyclop
          - funlen
          - gochecknoglobals
          - wastedassign
      - path: policy/fixtures/.*_negative/.*\.go
        linters:
          - gocognit
          - gocyclo
          - godot
          - ineffassign
          - mnd
          - unused
          - wsl_v5
          - cyclop
          - funlen
          - gochecknoglobals
          - wastedassign

  run:
    timeout: 5m
    tests: true
    modules-download-mode: readonly

  issues:
    max-same-issues: 0
    max-issues-per-linter: 0
    new: false

  formatters:
    enable:
      - gofumpt
      - goimports
    settings:
      gofumpt:
        extra:
          group-params: true
          clothe-returns: true
      goimports:
        local-prefixes:
          - github.com/adambarber/goconf

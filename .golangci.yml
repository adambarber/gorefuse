version: "2"

# The strictest lint gate: every linter listed below is enabled deliberately,
# and where settings could differ, the stricter value wins. A linter appears
# once, with every setting applied to it, merged.
#
# What is NOT here, and why — a consumer's policy declares only no_clones.
# No BPL budget, layers, or rule table rules exist in this tree;
# nothing here references them because none are declared.

linters:
  default: none
  enable:
    # correctness: a real defect, no taste
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - unparam
    - govet
    - bodyclose
    - noctx
    - containedctx
    - contextcheck
    - nilerr
    - nilnil
    - nilnesserr
    - errorlint
    - errname
    - err113
    - wrapcheck
    - forcetypeassert
    - errchkjson
    - unconvert
    - predeclared
    - copyloopvar
    - wastedassign
    - intrange
    - usestdlibvars
    - durationcheck
    - makezero
    - mirror
    - musttag
    - protogetter
    - canonicalheader
    - bidichk
    - asciicheck
    - dupword
    - rowserrcheck
    - sqlclosecheck
    - unqueryvet
    - nosprintfhostport
    - gosmopolitan
    - gocritic
    - goconst
    - exhaustive
    - gochecksumtype
    - prealloc
    - whitespace
    - goprintffuncname
    - gocheckcompilerdirectives
    - nolintlint
    - nonamedreturns
    - nakedret
    - dogsled
    - iotamixing
    - recvcheck
    - reassign
    - iface
    - inamedparam
    - perfsprint
    - usetesting
    - testableexamples
    - misspell
    - gomoddirectives
    - tagalign
    - modernize
    - godox
    - godot
    - wsl_v5

    # security
    - gosec
    - fatcontext
    - exptostd
    - mnd

    # budget discipline: size and complexity rules. The five budget linters
    # below mirror the thresholds the birdcage policy declares (file_budget,
    # function_budget, branching_budget, comment_budget), so each linter below
    # has a single owner. When the BPL budget rules take over these checks,
    # these five are removed in the same commit — never both at once.
    - funlen
    - gocyclo
    - gocognit
    - cyclop
    - maintidx

    # type discipline: exhaustiveness, concreteness, no ambient state
    - exhaustruct_v5
    - ireturn
    - interfacebloat
    - gochecknoglobals
    - gochecknoinits
    - forbidigo

    # test hygiene
    - tparallel
    - thelper

  disable:
    # taste: a house style, not a defect. Each fires on code this repo writes
    # on purpose; a rule that fires on correct code is a rule someone turns off.
    # Each is a global disable because none of these linters apply to any Go
    # code consumers write, and each names the taste it guards against.
    - lll                # line length: consumers write long rationale lines on purpose
    - noinlineerr        # guard scoping choice, not a defect
    - nlreturn           # blank line before return: reading choice
    - varnamelen         # short names in short scope are clear
    - tagliatelle        # struct-tag casing: no wire types yet
    - grouper            # import grouping: gofumpt owns layout
    - decorder           # declaration order: reading choice
    - godoclint          # comments are rationales, not API prose
    - funcorder          # exported before unexported: reading choice
    - embeddedstructfieldcheck # embedded-field placement: layout rule
    - paralleltest       # suite is deliberately serial where order matters
    - testpackage        # rule tables must be in-package to exercise unexported matchers
    - promlinter         # no metrics in this repository yet
    - loggercheck        # no logger in this repository yet
    - sloglint           # no slog in this repository yet
    - zerologlint        # no zerolog in this repository yet
    - testifylint        # suite uses the standard library
    - ginkgolinter       # neither ginkgo nor gomega is used
    - dupl               # duplication: policy's no_clones rule owns it
    - depguard           # import restriction: consumers pin no dependency policy
    - gomodguard         # module restriction: consumers pin no modules beyond their own

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    govet:
      enable-all: true
    staticcheck:
      checks:
        - SA
        - S
        - QF
        - '-ST1000'   # package comment form — consumer-repo house style
        - '-ST1003'   # initialism naming — consumer-repo chosen names
        - '-ST1020'   # exported comment form — consumer-repo house style
        - '-ST1021'   # comment on exported type — consumer-repo house style
        - '-ST1022'   # comment on exported var — consumer-repo house style
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
    exhaustive:
      default-signifies-exhaustive: false
    mnd:
      ignored-functions:
        - strconv.ParseInt
        - strconv.ParseFloat
        - strconv.ParseUint
        - strconv.Atoi
      ignored-numbers:
        - '0'
        - '1'
        - '-1'
        - '2'
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^any$'
          msg: "a bare `any` is an untyped value; name the domain kind"
    gocognit:
      min-complexity: 10
    cyclop:
      max-complexity: 10
      package-average: 0.0
    funlen:
      lines: 60
      statements: 40
    gocyclo:
      min-complexity: 10
    maintidx:
      under: 20
    godot:
      scope: declarations
      period: true
    godox:
      keywords: [TODO, FIXME, BUG, XXX]
    ireturn:
      allow:
        - error
        - stdlib.Error
        - ast.Expr
    interfacebloat:
      max: 5
    dogsled:
      max-blank-identifiers: 2
    perfsprint:
      strconcat: true
      sprintf1: true
      err-error: false
    goconst:
      min-len: 3
      min-occurrences: 3
    wsl_v5:
      branch-max-lines: 2
    prealloc:
      simple: true
      range-loops: true
    unparam:
      check-exported: false

  exclusions:
    generated: strict
    # Because is the settled public name of the generic refusal carrier;
    # renaming to BecauseError would break the design. This exclusion covers
    # only the file that declares it.
    rules:
      # From's type parameter R must accept any reason kind a domain
      # declares; a constraint cannot name a domain kind, so `any` is the
      # only permissive spelling. The exclusion covers only that constraint.
      - path: from\.go
        linters:
          - forbidigo
      # Because's type parameter R must accept any reason kind a domain
      # declares; a constraint cannot name a domain kind, so `any` is the
      # only permissive spelling. The exclusion covers only that constraint.
      - path: because\.go
        linters:
          - errname
          - forbidigo
      # render_test.go's test helpers are generic over the reason kind the
      # same way Because is; a constraint cannot name a domain kind, so `any`
      # is the only permissive spelling. The exclusion covers only that file.
      - path: render_test\.go
        linters:
          - forbidigo
          - modernize
      # policy/fixtures/* are intentionally rule-violating examples: the BPL
      # budget rules are supposed to fire on them. Excluding them from lint
      # keeps the gate clean without weakening it — a fixture that passes lint
      # is a fixture that doesn't test its rule.
      - path: policy/fixtures/.*_positive/.*\.go
        linters:
          - forbidigo   # the no_untyped_value positive fixture must spell `any` to prove the rule bites
          - gocognit
          - gocyclo
          - godot
          - ineffassign
          - mnd
          - unused
          - wsl_v5
          - cyclop
          - funlen
          - gochecknoglobals
          - wastedassign
      - path: policy/fixtures/.*_negative/.*\.go
        linters:
          - gocognit
          - gocyclo
          - godot
          - ineffassign
          - mnd
          - unused
          - wsl_v5
          - cyclop
          - funlen
          - gochecknoglobals
          - wastedassign

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
  new: false

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/adambarber/gorefuse
